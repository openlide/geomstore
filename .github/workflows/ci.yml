name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

# 最小权限：本工作流只需读取仓库（checkout）与写制品（upload-artifact）。
# actions: write 是 upload/download-artifact 调用 Runtime Tools API 的前置权限，缺失会 403。
permissions:
  contents: read
  actions: write

jobs:
  verify:
    name: Lint / Typecheck / Test / Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:ci

      - name: Typecheck (src)
        run: pnpm run typecheck

      - name: Typecheck (tests)
        run: pnpm run typecheck:tests

      - name: Typecheck (examples)
        run: pnpm run typecheck:examples

      - name: Test with coverage
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      - name: Smoke test dist bundles (ESM + subpath)
        run: |
          node --input-type=module -e '
            const { readFileSync } = await import("node:fs")
            const { exports: exp } = JSON.parse(readFileSync("package.json", "utf8"))
            const base = import.meta.resolve("./")
            const viaExports = (key) => import(new URL("./" + exp[key].default.replace(/^\.\//, ""), base).href)
            const s = await viaExports(".")
            const store = s.createStore({
              name: "ci-smoke",
              state: { count: 1 },
              actions: { inc() { this.setState("count", this.state.count + 1) } },
            })
            store.dispatch("inc")
            if (store.getState().count !== 2) throw new Error("esm smoke failed")
            if (typeof s.composeStore !== "function") throw new Error("composeStore missing")
            const err = await viaExports("./extras/error")
            if (typeof err.GeomStoreError !== "function") throw new Error("error subpath failed")
            const plugins = await viaExports("./extras/plugins")
            if (!plugins.loggerPlugin) throw new Error("plugins subpath failed")
            const selector = await viaExports("./extras/selector")
            if (typeof selector.createSelector !== "function") throw new Error("selector subpath failed")
            const integrations = await viaExports("./integrations")
            if (typeof integrations.bindMappings !== "function") throw new Error("integrations subpath failed")
            console.log("ESM SMOKE OK (exports map exercised)")
          '

      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov-report
          retention-days: 14
