# pnpm 工作区配置
# 当前仅根包纳入锁文件管理；packages/benchmark 为实验性子包，暂未接入
# —— 它不在这里声明 `packages:`，根 package.json 也刻意不写 npm 风格的 `workspaces`：
#    两处都写会让 npm/yarn 与 pnpm 得出两套拓扑（前者链接子包、后者不链接），
#    而子包声明的 devDependencies 在 pnpm 下永不被安装。
# 子包的编译与冒烟一律借用根装的 typescript，由 CI 直接执行：
#    npx tsc -p packages/benchmark/tsconfig.json && node packages/benchmark/dist/smoke.js
# 接入本包的前提是先补齐它自己的 devDependencies 安装路径并重生成锁文件。
# allowBuilds：批准依赖的安装脚本（pnpm 10+ 默认禁止构建脚本）
allowBuilds:
  esbuild: true
  unrs-resolver: true

# nodeLinker：改用提升（hoisted）布局，node_modules 下全部为真实目录。
# 默认的 isolated 布局依赖 junction/符号链接；部分 Windows 环境受安全策略限制
# 无法遍历重解析点（scandir 报 UNKNOWN、PowerShell 报 untrusted mount point），
# 会导致依赖解析全部失败。hoisted 不产生任何链接，可彻底规避该问题。
# 代价：依赖被平铺提升，失去 isolated 的严格隔离（可能出现幽灵依赖）。
# 环境允许遍历链接时，可删除本项回到默认 isolated 布局。
nodeLinker: hoisted
